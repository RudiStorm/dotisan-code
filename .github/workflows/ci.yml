name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: dotnet restore Dotisan.sln
      - run: dotnet build Dotisan.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test Dotisan.sln --configuration Release --no-build --verbosity minimal
      - name: Build generated authenticated and unauthenticated Vue projects
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj -- new CiAuthWeb --auth yes --registration public --yes --no-restore --output "$RUNNER_TEMP/dotisan-auth-web"
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj -- new CiPlainWeb --auth no --yes --no-restore --output "$RUNNER_TEMP/dotisan-plain-web"
          for web in "$RUNNER_TEMP/dotisan-auth-web/src/CiAuthWeb.Web" "$RUNNER_TEMP/dotisan-plain-web/src/CiPlainWeb.Web"; do
            pnpm --dir "$web" install --frozen-lockfile=false
            pnpm --dir "$web" run build
            pnpm --dir "$web" test
          done
      - name: Pack CLI
        run: dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dotisan-nuget
          path: artifacts/*.nupkg
          if-no-files-found: error

  browser-smoke:
    runs-on: ubuntu-latest
    needs: repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Generate authenticated frontend
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new BrowserApp --auth yes --registration public --yes --no-restore --output "$RUNNER_TEMP/dotisan-browser"
          pnpm --dir "$RUNNER_TEMP/dotisan-browser/src/BrowserApp.Web" install --no-frozen-lockfile
      - name: Install Playwright browser harness
        run: |
          npm ci --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium
      - name: Run browser smoke tests
        env:
          DOTISAN_FRONTEND_DIR: ${{ runner.temp }}/dotisan-browser/src/BrowserApp.Web
        run: |
          pnpm --dir "$DOTISAN_FRONTEND_DIR" dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/dotisan-vite.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173 >/dev/null
          npm run test:e2e --prefix tests/browser

  dependency-audit:
    runs-on: ubuntu-latest
    needs: repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: dotnet restore Dotisan.sln
      - run: dotnet list Dotisan.sln package --vulnerable --include-transitive
      - run: npm ci --prefix tests/browser
      - run: npm audit --prefix tests/browser --omit=dev --audit-level=high

  database-compose-smoke:
    name: PostgreSQL Compose smoke
    runs-on: ubuntu-latest
    needs: repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Generate PostgreSQL project
        shell: bash
        run: |
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new ComposeSmoke --profile minimal --database postgresql --yes --no-restore --output "$RUNNER_TEMP/dotisan-compose"
      - name: Start generated PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail
          compose_file="$RUNNER_TEMP/dotisan-compose/compose.yaml"
          test -f "$compose_file"
          docker compose -f "$compose_file" config >/dev/null
          trap 'docker compose -f "$compose_file" down --volumes --remove-orphans' EXIT
          docker compose -f "$compose_file" up -d --wait --wait-timeout 120 database
          docker compose -f "$compose_file" ps database

  pack-and-inspect:
    runs-on: ubuntu-latest
    needs: [repository, generated-api, browser-smoke, dependency-audit, database-compose-smoke]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - run: dotnet restore Dotisan.sln
      - name: Clean package output directory
        shell: bash
        run: find artifacts -maxdepth 1 -type f -name '*.nupkg' -delete
      - run: dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release --no-restore --output artifacts
      - name: Inspect package contents
        shell: bash
        run: |
          test "$(find artifacts -name '*.nupkg' | wc -l)" -eq 1
          archive=$(find artifacts -name '*.nupkg' | head -n 1)
          unzip -Z1 "$archive" > package-contents.txt
          grep 'Dotisan.Cli.dll' package-contents.txt >/dev/null
          if grep -E '(^|/)(node_modules|bin|obj|.*\.db|.*\.(pfx|pem|key)$)' package-contents.txt >/dev/null; then
            echo 'Package contains forbidden generated artifacts.' >&2
            exit 1
          fi

  publish-nuget:
    name: Publish NuGet package (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [repository, generated-api, browser-smoke, dependency-audit, pack-and-inspect]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - run: dotnet restore Dotisan.sln
      - name: Pack release package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+].*)?$') { throw "Release builds must run from a semantic-version tag (received '$version')." }
          dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release --no-restore --output artifacts -p:Version=$version
      - name: Exchange GitHub OIDC identity for a temporary NuGet credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $package = Get-ChildItem artifacts -Filter "Dotisan.$version.nupkg" | Select-Object -First 1
          if ($null -eq $package) { throw "Expected package Dotisan.$version.nupkg was not produced." }
          dotnet nuget push $package.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  generated-api:
    runs-on: ubuntu-latest
    env:
      # Generated-project compile and contract smoke tests run in the safe local profile.
      # This avoids production-only configuration validation (SMTP, HTTPS, key-ring)
      # from masking whether the generated source itself builds correctly.
      ASPNETCORE_ENVIRONMENT: Development
    strategy:
      matrix:
        profile: [minimal, identity, saas, maximal]
        package_manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Enable package-manager tooling
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Generate project
        shell: pwsh
        run: |
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }} --profile ${{ matrix.profile }} --yes --package-manager ${{ matrix.package_manager }} --output ${{ github.workspace }}/generated/${{ matrix.profile }}-${{ matrix.package_manager }}
      - run: dotnet restore generated/${{ matrix.profile }}-${{ matrix.package_manager }}/GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }}.sln
      - run: dotnet build generated/${{ matrix.profile }}-${{ matrix.package_manager }}/GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }}.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test generated/${{ matrix.profile }}-${{ matrix.package_manager }}/GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }}.sln --configuration Release --no-build --no-restore --verbosity minimal
      - name: Exercise resource and contract generation workflow
        if: matrix.profile == 'identity' || matrix.profile == 'maximal'
        shell: bash
        run: |
          cd generated/${{ matrix.profile }}-${{ matrix.package_manager }}
          dotnet run --project ../../src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- make:resource Customer
          dotnet run --project ../../src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- make:crud Customer
          dotnet build GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }}.sln --configuration Release --no-restore --warnaserror
          dotnet run --project ../../src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- generate --no-openapi --no-build
          dotnet run --project ../../src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- generate --check --no-openapi --no-build
      - name: Verify generated frontend
        shell: bash
        run: bash scripts/test-generated-project.sh "${{ github.workspace }}/generated/${{ matrix.profile }}-${{ matrix.package_manager }}" "${{ matrix.package_manager }}"
