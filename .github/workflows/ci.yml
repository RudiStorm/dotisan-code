name: CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Dotisan.sln
      - run: dotnet build Dotisan.sln --no-restore --configuration Release
      - run: dotnet test Dotisan.sln --no-build --configuration Release --verbosity normal
      - name: Pack CLI
        run: dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --no-build --configuration Release --output artifacts
