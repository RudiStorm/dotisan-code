name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  repository:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: dotnet restore Dotisan.sln
      - run: dotnet build Dotisan.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test Dotisan.sln --configuration Release --no-build --verbosity minimal
      - name: Build generated authenticated and unauthenticated Vue projects
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          $auth = Join-Path $env:RUNNER_TEMP 'dotisan-auth-web'
          $plain = Join-Path $env:RUNNER_TEMP 'dotisan-plain-web'
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj -- new CiAuthWeb --auth yes --registration public --yes --no-restore --output $auth
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj -- new CiPlainWeb --auth no --yes --no-restore --output $plain
          foreach ($web in @((Join-Path $auth 'src/CiAuthWeb.Web'), (Join-Path $plain 'src/CiPlainWeb.Web'))) {
            pnpm.cmd --dir $web install --frozen-lockfile=false
            if ($LASTEXITCODE -ne 0) { throw "pnpm install failed with exit code $LASTEXITCODE" }
            pnpm.cmd --dir $web run build
            if ($LASTEXITCODE -ne 0) { throw "pnpm build failed with exit code $LASTEXITCODE" }
            pnpm.cmd --dir $web test
            if ($LASTEXITCODE -ne 0) { throw "pnpm test failed with exit code $LASTEXITCODE" }
          }
      - name: Pack CLI
        run: dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dotisan-nuget
          path: artifacts/*.nupkg
          if-no-files-found: error

  browser-smoke:
    runs-on: [self-hosted, windows, x64]
    needs: repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Generate authenticated frontend
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          $output = Join-Path $env:RUNNER_TEMP 'dotisan-browser'
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new BrowserApp --auth yes --registration public --yes --no-restore --output $output
          pnpm.cmd --dir (Join-Path $output 'src/BrowserApp.Web') install --no-frozen-lockfile
      - name: Install Playwright browser harness
        shell: pwsh
        run: |
          npm.cmd ci --prefix tests/browser
          npx.cmd --prefix tests/browser playwright install chromium
      - name: Run browser smoke tests
        shell: pwsh
        env:
          DOTISAN_FRONTEND_DIR: ${{ runner.temp }}\dotisan-browser\src\BrowserApp.Web
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'dotisan-vite.log'
          $errorLog = Join-Path $env:RUNNER_TEMP 'dotisan-vite-error.log'
          $vite = Start-Process -FilePath 'pnpm.cmd' -ArgumentList @('--dir', $env:DOTISAN_FRONTEND_DIR, 'dev', '--host', '127.0.0.1', '--port', '4173') -RedirectStandardOutput $log -RedirectStandardError $errorLog -PassThru
          try {
            $ready = $false
            1..30 | ForEach-Object {
              if (-not $ready) {
                try { Invoke-WebRequest -Uri 'http://127.0.0.1:4173' -UseBasicParsing -TimeoutSec 2 | Out-Null; $ready = $true } catch { Start-Sleep -Seconds 1 }
              }
            }
            if (-not $ready) { throw "Vite did not start. See $log" }
            npm.cmd run test:e2e --prefix tests/browser
            if ($LASTEXITCODE -ne 0) { throw "Browser smoke tests failed with exit code $LASTEXITCODE" }
          } finally { if (-not $vite.HasExited) { Stop-Process -Id $vite.Id -Force } }

  dependency-audit:
    runs-on: [self-hosted, windows, x64]
    needs: repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: dotnet restore Dotisan.sln
      - run: dotnet list Dotisan.sln package --vulnerable --include-transitive
      - run: npm ci --prefix tests/browser
      - run: npm audit --prefix tests/browser --omit=dev --audit-level=high

  database-compose-smoke:
    name: PostgreSQL Compose smoke
    runs-on: [self-hosted, windows, x64]
    needs: repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Generate PostgreSQL project
        shell: pwsh
        run: |
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new ComposeSmoke --profile minimal --database postgresql --yes --no-restore --output (Join-Path $env:RUNNER_TEMP 'dotisan-compose')
      - name: Start generated PostgreSQL service
        shell: pwsh
        run: |
          $compose = Join-Path $env:RUNNER_TEMP 'dotisan-compose\compose.yaml'
          if (-not (Test-Path $compose)) { throw "Compose file not found: $compose" }
          docker compose -f $compose config
          if ($LASTEXITCODE -ne 0) { throw 'Compose configuration is invalid.' }
          try {
            docker compose -f $compose up -d --wait --wait-timeout 120 database
            if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL service failed to start.' }
            docker compose -f $compose ps database
          } finally { docker compose -f $compose down --volumes --remove-orphans }

  pack-and-inspect:
    runs-on: [self-hosted, windows, x64]
    needs: [repository, generated-api, browser-smoke, dependency-audit, database-compose-smoke]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - run: dotnet restore Dotisan.sln
      - name: Clean package output directory
        shell: pwsh
        run: Get-ChildItem -LiteralPath artifacts -Filter '*.nupkg' -File | Remove-Item -Force
      - run: dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release --no-restore --output artifacts
      - name: Inspect package contents
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one package, found $($packages.Count)." }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $names = @($zip.Entries | ForEach-Object FullName)
            if (-not ($names -contains 'tools/net10.0/any/Dotisan.Cli.dll')) { throw 'Dotisan.Cli.dll is missing from the package.' }
            $forbidden = $names | Where-Object { $_ -match '(^|/)(node_modules|bin|obj|.*\.db|.*\.(pfx|pem|key)$)' }
            if ($forbidden) { throw "Package contains forbidden generated artifacts: $($forbidden -join ', ')" }
          } finally { $zip.Dispose() }

  publish-nuget:
    name: Publish NuGet package (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [repository, generated-api, browser-smoke, dependency-audit, pack-and-inspect]
    runs-on: [self-hosted, windows, x64]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - run: dotnet restore Dotisan.sln
      - name: Pack release package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+].*)?$') { throw "Release builds must run from a semantic-version tag (received '$version')." }
          dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release --no-restore --output artifacts -p:Version=$version
      - name: Exchange GitHub OIDC identity for a temporary NuGet credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $package = Get-ChildItem artifacts -Filter "Dotisan.$version.nupkg" | Select-Object -First 1
          if ($null -eq $package) { throw "Expected package Dotisan.$version.nupkg was not produced." }
          dotnet nuget push $package.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  generated-api:
    runs-on: [self-hosted, windows, x64]
    env:
      # Generated-project compile and contract smoke tests run in the safe local profile.
      # This avoids production-only configuration validation (SMTP, HTTPS, key-ring)
      # from masking whether the generated source itself builds correctly.
      ASPNETCORE_ENVIRONMENT: Development
    strategy:
      matrix:
        profile: [minimal, identity, saas, maximal]
        package_manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Enable package-manager tooling
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Generate project
        shell: pwsh
        run: |
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }} --profile ${{ matrix.profile }} --yes --package-manager ${{ matrix.package_manager }} --output ${{ github.workspace }}/generated/${{ matrix.profile }}-${{ matrix.package_manager }}
      - run: dotnet restore generated/${{ matrix.profile }}-${{ matrix.package_manager }}/GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }}.sln
      - run: dotnet build generated/${{ matrix.profile }}-${{ matrix.package_manager }}/GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }}.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test generated/${{ matrix.profile }}-${{ matrix.package_manager }}/GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }}.sln --configuration Release --no-build --no-restore --verbosity minimal
      - name: Exercise resource and contract generation workflow
        if: matrix.profile == 'identity' || matrix.profile == 'maximal'
        shell: pwsh
        run: |
          Set-Location generated/${{ matrix.profile }}-${{ matrix.package_manager }}
          dotnet run --project ../../src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- make:resource Customer
          dotnet run --project ../../src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- make:crud Customer
          dotnet build GeneratedApp${{ matrix.profile }}${{ matrix.package_manager }}.sln --configuration Release --no-restore --warnaserror
          dotnet run --project ../../src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- generate --no-openapi --no-build
          dotnet run --project ../../src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- generate --check --no-openapi --no-build
      - name: Verify generated frontend
        shell: pwsh
        run: .\scripts\Test-GeneratedProject-Windows.ps1 "${{ github.workspace }}\generated\${{ matrix.profile }}-${{ matrix.package_manager }}" "${{ matrix.package_manager }}"
