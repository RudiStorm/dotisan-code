name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: dotnet restore Dotisan.sln
      - run: dotnet build Dotisan.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test Dotisan.sln --configuration Release --no-build --verbosity minimal
      - name: Build generated authenticated and unauthenticated Vue projects
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj -- new CiAuthWeb --auth yes --registration public --yes --no-restore --output "$RUNNER_TEMP/dotisan-auth-web"
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj -- new CiPlainWeb --auth no --yes --no-restore --output "$RUNNER_TEMP/dotisan-plain-web"
          for web in "$RUNNER_TEMP/dotisan-auth-web/src/CiAuthWeb.Web" "$RUNNER_TEMP/dotisan-plain-web/src/CiPlainWeb.Web"; do
            pnpm --dir "$web" install --frozen-lockfile=false
            pnpm --dir "$web" run build
            pnpm --dir "$web" test
          done
      - name: Pack CLI
        run: dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dotisan-nuget
          path: artifacts/*.nupkg
          if-no-files-found: error

  browser-smoke:
    runs-on: ubuntu-latest
    needs: repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Generate authenticated frontend
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new BrowserApp --auth yes --registration public --yes --no-restore --output "$RUNNER_TEMP/dotisan-browser"
          pnpm --dir "$RUNNER_TEMP/dotisan-browser/src/BrowserApp.Web" install --no-frozen-lockfile
      - name: Install Playwright browser harness
        run: |
          npm ci --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium
      - name: Run browser smoke tests
        env:
          DOTISAN_FRONTEND_DIR: ${{ runner.temp }}/dotisan-browser/src/BrowserApp.Web
        run: |
          pnpm --dir "$DOTISAN_FRONTEND_DIR" dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/dotisan-vite.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173 >/dev/null
          npm run test:e2e --prefix tests/browser

  dependency-audit:
    runs-on: ubuntu-latest
    needs: repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: dotnet restore Dotisan.sln
      - run: dotnet list Dotisan.sln package --vulnerable --include-transitive
      - run: npm ci --prefix tests/browser
      - run: npm audit --prefix tests/browser --omit=dev --audit-level=high

  pack-and-inspect:
    runs-on: ubuntu-latest
    needs: [repository, generated-api, browser-smoke, dependency-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore Dotisan.sln
      - run: dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release --no-restore --output artifacts
      - name: Inspect package contents
        shell: bash
        run: |
          test "$(find artifacts -name '*.nupkg' | wc -l)" -eq 1
          archive=$(find artifacts -name '*.nupkg' | head -n 1)
          tar -tf "$archive" | grep -q 'Dotisan.Cli.dll'
          ! tar -tf "$archive" | grep -E '(^|/)(node_modules|bin|obj|.*\.db|.*\.(pfx|pem|key)$)'

  publish-nuget:
    name: Publish NuGet package (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [repository, generated-api, browser-smoke, dependency-audit, pack-and-inspect]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore Dotisan.sln
      - name: Pack release package
        run: dotnet pack src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release --no-restore --output artifacts
      - name: Exchange GitHub OIDC identity for a temporary NuGet credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package
        run: dotnet nuget push artifacts/Dotisan.0.8.6.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  generated-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: [plain, integrations]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Generate project
        shell: pwsh
        run: |
          if ('${{ matrix.feature }}' -eq 'integrations') {
            dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new GeneratedApp${{ matrix.feature }} --yes --auth yes --registration public --tenant yes --notifications yes --storage yes --caching yes --imports-exports yes --webhooks yes --no-restore --output ${{ github.workspace }}/generated/${{ matrix.feature }}
          } else {
            dotnet run --project src/Dotisan.Cli/Dotisan.Cli.csproj --configuration Release -- new GeneratedApp${{ matrix.feature }} --yes --no-restore --output ${{ github.workspace }}/generated/${{ matrix.feature }}
          }
      - run: dotnet restore generated/${{ matrix.feature }}/GeneratedApp${{ matrix.feature }}.sln
      - run: dotnet build generated/${{ matrix.feature }}/GeneratedApp${{ matrix.feature }}.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test generated/${{ matrix.feature }}/GeneratedApp${{ matrix.feature }}.sln --configuration Release --no-build --no-restore --verbosity minimal
